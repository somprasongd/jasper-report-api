name: Release

# Normally started by `make release VERSION=1.2.3` (see CLAUDE.md), which pushes the v1.2.3 tag.
# Builds the jar, pushes the Docker image to GHCR and creates the GitHub Release (notes from CHANGELOG.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release
  packages: write   # push to ghcr.io

env:
  REGISTRY: ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Check the tag matches pom.xml and CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          POM="$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          [ "$POM" = "$VERSION" ] || { echo "::error::tag $GITHUB_REF_NAME but pom.xml is $POM (use 'make release')"; exit 1; }
          awk -v v="$VERSION" '/^## \[/ { if (f) exit; f = index($0, "## [" v "]") == 1; next } f' CHANGELOG.md > release-notes.md
          [ -n "$(tr -d '[:space:]' < release-notes.md)" ] || { echo "::error::no CHANGELOG.md section for $VERSION"; exit 1; }

      - name: Build and test the jar
        run: ./mvnw -B verify

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          # v1.2.3 -> 1.2.3, 1.2, 1 and latest (pre-releases get only their own tag)
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release with the jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          case "$GITHUB_REF_NAME" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" target/jasper-report-api-*.jar \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md $FLAGS
