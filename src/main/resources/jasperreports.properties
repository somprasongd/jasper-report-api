# JasperReports engine defaults for this API (read from the classpath root).

# Barcode/QR modules are drawn as raster images (300 ppi) instead of SVG rectangles. The SVG form leaves hairline
# seams between modules in several PDF viewers/renderers, which can stop phone and handheld scanners reading
# a QR code from a screen. Raster output has no seams and prints sharply at 300 ppi.
net.sf.jasperreports.components.barcode4j.image.producer=image
