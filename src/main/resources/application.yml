server:
  port: 8080
  servlet:
    context-path: /api
  shutdown: graceful

spring:
  application:
    name: jasper-report-api
  mvc:
    problemdetails:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # Multi-tenant / many datasources are easiest in a mounted YAML: ./config/application.yml is picked up automatically.

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,reportDatasources,reportStorage
  metrics:
    tags:
      application: jasper-report-api

# All settings of the API itself. See README.md ("Configuration") for every option.
report:
  timezone: Asia/Bangkok
  sources:
    local:
      root: ${REPORT_LOCAL_ROOT:reports}
    s3:
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      path-style-access: true
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      allowed-buckets: ${S3_ALLOWED_BUCKETS:}
    http:
      allowed-hosts: ${HTTP_ALLOWED_HOSTS:}
  cache:
    work-dir: ${REPORT_CACHE_DIR:cache}
  security:
    api-key:
      mode: ${API_KEY_MODE:required}

# Single-database deployment: set these (or use the YAML form for several tenants / datasources).
tenants:
  default:
    default-datasource: opd
    datasources:
      opd:
        url: ${OPD_DB_URL:}
        username: ${OPD_DB_USER:}
        password: ${OPD_DB_PASSWORD:}
        pool-size: ${OPD_DB_POOL_SIZE:5}
      ipd:
        url: ${IPD_DB_URL:}
        username: ${IPD_DB_USER:}
        password: ${IPD_DB_PASSWORD:}
        pool-size: ${IPD_DB_POOL_SIZE:3}
